<script>
        const apiSelect = document.getElementById("api-select");
        const platformSelect = document.getElementById("platform-select");
        const songidInput = document.getElementById("songid-input");
        const sendBtn = document.getElementById("send-btn");
        const sendIcon = document.getElementById("send-icon");
        const loadingSpinner = document.getElementById("loading-spinner");
        const sendText = document.getElementById("send-text");
        const resultsSection = document.getElementById("results-section");
        const viewCardBtn = document.getElementById("view-card-btn");
        const viewJsonBtn = document.getElementById("view-json-btn");
        const cardView = document.getElementById("card-view");
        const jsonView = document.getElementById("json-view");
        const coverImg = document.getElementById("cover-img");
        const songTitle = document.getElementById("song-title");
        const songArtist = document.getElementById("song-artist");
        const platformBadge = document.getElementById("platform-badge");
        const songidChip = document.getElementById("songid-chip");
        const playBtn = document.getElementById("play-btn");
        const downloadBtn = document.getElementById("download-btn");
        const audioPlayer = document.getElementById("audio-player");
        const statusText = document.getElementById("status-text");
        const latencyText = document.getElementById("latency-text");
        const apiTrigger = document.getElementById("api-trigger");
        const apiMenu = document.getElementById("api-menu");
        const apiLabel = document.getElementById("api-label");
        const platformTrigger = document.getElementById("platform-trigger");
        const platformMenu = document.getElementById("platform-menu");
        const platformLabel = document.getElementById("platform-label");

        const STATE = {
            lastPlayUrl: null,
            lastCoverUrl: null,
            lastLinkUrl: null,
        };

        const PLATFORM_LABEL = {
            qq: "QQ",
            kugou: "酷狗",
            kuwo: "酷我",
        };

        function setLoading(isLoading) {
            sendBtn.disabled = isLoading;
            sendIcon.classList.toggle("hidden", isLoading);
            loadingSpinner.classList.toggle("hidden", !isLoading);
            sendText.textContent = isLoading ? "请求中..." : "发送请求";
        }

        function closeMenus() {
            apiMenu.classList.add("hidden");
            platformMenu.classList.add("hidden");
        }

        function toggleMenu(menu) {
            const willOpen = menu.classList.contains("hidden");
            closeMenus();
            if (willOpen) {
                menu.classList.remove("hidden");
            }
        }

        document.addEventListener("click", (e) => {
            const target = e.target;
            if (!(target instanceof Element)) {
                return;
            }
            const inApi = target.closest("#api-dropdown");
            const inPlatform = target.closest("#platform-dropdown");
            if (!inApi && !inPlatform) {
                closeMenus();
            }
        });

        apiTrigger.addEventListener("click", () => toggleMenu(apiMenu));
        apiMenu.querySelectorAll("button[data-value]").forEach((btn) => {
            btn.addEventListener("click", () => {
                const value = btn.getAttribute("data-value");
                if (value) {
                    apiSelect.value = value;
                    const label = btn.getAttribute("data-label") || btn.textContent.trim();
                    apiLabel.textContent = label;
                }
                closeMenus();
            });
        });

        platformTrigger.addEventListener("click", () => toggleMenu(platformMenu));
        platformMenu.querySelectorAll("button[data-value]").forEach((btn) => {
            btn.addEventListener("click", () => {
                const value = btn.getAttribute("data-value");
                const label = btn.getAttribute("data-label") || btn.textContent.trim();
                if (value) {
                    platformSelect.value = value;
                    platformLabel.textContent = label;
                }
                platformMenu.querySelectorAll(".material-symbols-outlined").forEach((icon) => icon.classList.add("hidden"));
                const icon = btn.querySelector(".material-symbols-outlined");
                if (icon) {
                    icon.classList.remove("hidden");
                }
                closeMenus();
            });
        });

        function setActiveView(view) {
            const isCard = view === "card";
            cardView.classList.toggle("hidden", !isCard);
            jsonView.classList.toggle("hidden", isCard);
            viewCardBtn.classList.toggle("bg-surface-container-lowest", isCard);
            viewCardBtn.classList.toggle("shadow-sm", isCard);
            viewCardBtn.classList.toggle("text-on-surface", isCard);
            viewCardBtn.classList.toggle("text-secondary", !isCard);
            viewJsonBtn.classList.toggle("bg-surface-container-lowest", !isCard);
            viewJsonBtn.classList.toggle("shadow-sm", !isCard);
            viewJsonBtn.classList.toggle("text-on-surface", !isCard);
            viewJsonBtn.classList.toggle("text-secondary", isCard);
        }

        function safeText(value) {
            if (typeof value === "string" && value.trim()) {
                return value.trim();
            }
            return "-";
        }

        function updateVisual(data) {
            const platform = data && typeof data.platform === "string" ? data.platform : null;
            const name = data ? data.name : null;
            const artist = data ? data.artist : null;
            const songid = data ? data.songid : null;
            const url = data ? data.url : null;
            const cover = data ? data.cover : null;
            const link = data ? data.link : null;

            songTitle.textContent = safeText(name);
            songArtist.textContent = safeText(artist);
            songidChip.textContent = `ID: ${safeText(songid)}`;
            platformBadge.textContent = platform && PLATFORM_LABEL[platform] ? PLATFORM_LABEL[platform] : safeText(platform);

            STATE.lastPlayUrl = typeof url === "string" ? url : null;
            STATE.lastCoverUrl = typeof cover === "string" ? cover : null;
            STATE.lastLinkUrl = typeof link === "string" ? link : null;

            if (STATE.lastPlayUrl) {
                if (audioPlayer.getAttribute("src") !== STATE.lastPlayUrl) {
                    audioPlayer.setAttribute("src", STATE.lastPlayUrl);
                }
            } else {
                audioPlayer.pause();
                audioPlayer.removeAttribute("src");
                audioPlayer.load();
            }

            if (STATE.lastCoverUrl) {
                coverImg.src = STATE.lastCoverUrl;
            } else {
                coverImg.removeAttribute("src");
            }
        }

        function updateStatus(code, message, ms) {
            const ok = typeof code === "number" && code >= 200 && code < 300;
            const codeText = typeof code === "number" ? code : "-";
            statusText.textContent = ok ? `${codeText} 成功` : `${codeText} 失败`;
            if (typeof ms === "number") {
                latencyText.textContent = `响应时间: ${ms}ms`;
            } else {
                latencyText.textContent = "响应时间: -";
            }
        }

        async function sendRequest() {
            const api = apiSelect.value;
            if (api !== "play-info") {
                updateStatus(400, "Unsupported api", null);
                return;
            }
            const platform = platformSelect.value;
            const id = songidInput.value.trim();
            if (!id) {
                updateStatus(400, "Invalid id", null);
                return;
            }

            setLoading(true);
            resultsSection.classList.add("hidden");
            const startedAt = Date.now();
            try {
                const res = await fetch("/v1/music/play-info", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ platform, id }),
                });
                const text = await res.text();
                const ms = Date.now() - startedAt;
                let obj;
                try {
                    obj = JSON.parse(text);
                } catch (_) {
                    obj = { code: res.status, message: text, service: "coco音乐", data: null };
                }
                jsonView.textContent = JSON.stringify(obj, null, 2);
                updateStatus(obj.code, obj.message, ms);
                updateVisual(obj.data);
                setActiveView("card");
                resultsSection.classList.remove("hidden");
            } catch (err) {
                const ms = Date.now() - startedAt;
                jsonView.textContent = JSON.stringify({ code: 500, message: String(err), service: "coco音乐", data: null }, null, 2);
                updateStatus(500, String(err), ms);
                updateVisual(null);
                setActiveView("json");
                resultsSection.classList.remove("hidden");
            } finally {
                setLoading(false);
            }
        }

        viewCardBtn.addEventListener("click", () => setActiveView("card"));
        viewJsonBtn.addEventListener("click", () => setActiveView("json"));
        sendBtn.addEventListener("click", () => sendRequest());
        songidInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                sendRequest();
            }
        });
        playBtn.addEventListener("click", () => {
            if (STATE.lastPlayUrl) {
                if (audioPlayer.getAttribute("src") !== STATE.lastPlayUrl) {
                    audioPlayer.setAttribute("src", STATE.lastPlayUrl);
                }
                if (audioPlayer.paused) {
                    void audioPlayer.play();
                } else {
                    audioPlayer.pause();
                }
            }
        });
        downloadBtn.addEventListener("click", () => {
            if (STATE.lastPlayUrl) {
                const a = document.createElement("a");
                a.href = STATE.lastPlayUrl;
                a.download = "";
                document.body.appendChild(a);
                a.click();
                a.remove();
            }
        });
        coverImg.addEventListener("click", () => {
            if (STATE.lastLinkUrl) {
                window.open(STATE.lastLinkUrl, "_blank", "noopener,noreferrer");
            } else if (STATE.lastPlayUrl) {
                playBtn.click();
            }
        });

        setActiveView("card");
        updateStatus(null, null, null);
        updateVisual(null);
        setLoading(false);
        platformMenu.querySelectorAll(".material-symbols-outlined").forEach((icon) => icon.classList.add("hidden"));
        const defaultPlatformBtn = platformMenu.querySelector("button[data-value=\"kugou\"] .material-symbols-outlined");
        if (defaultPlatformBtn) {
            defaultPlatformBtn.classList.remove("hidden");
        }
    </script>
</body></html>
