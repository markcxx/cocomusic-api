name: Build Docker Image and Export as Artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image_name: ${{ steps.tag.outputs.image_name }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Generate image tag
      id: tag
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG=${GITHUB_REF#refs/tags/}
        elif [[ "${{ github.ref }}" == refs/heads/* ]]; then
          TAG=${GITHUB_REF#refs/heads/}
          TAG=${TAG//\//-}
        else
          TAG="pr-${{ github.event.number }}"
        fi
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "image_name=cocomusic-api:latest" >> $GITHUB_OUTPUT

    - name: Create Dockerfile for CI
      run: |
        cat > Dockerfile.ci << 'EOF'
        FROM python:3.12-slim
        WORKDIR /app
        RUN apt-get update && apt-get install -y curl && apt-get clean && rm -rf /var/lib/apt/lists/*
        COPY requirements.txt ./requirements.txt
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 8000
        HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 CMD curl -f http://localhost:8000/api/docs || exit 1
        CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        EOF

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.ci
        platforms: linux/amd64
        push: false
        tags: ${{ steps.tag.outputs.image_name }}
        outputs: type=docker,dest=/tmp/cocomusic-api-latest.tar
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Upload Docker image as artifact
      uses: actions/upload-artifact@v4
      with:
        name: cocomusic-api-latest-${{ steps.tag.outputs.tag }}
        path: /tmp/cocomusic-api-latest.tar
        retention-days: 1

    - name: Generate download instructions
      run: |
        echo "## Docker Image Built Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download and Load Instructions:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "1. 在GitHub Actions页面点击 \`cocomusic-api-latest-${{ steps.tag.outputs.tag }}\` 下载tar文件" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "2. 加载和运行镜像:" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "docker load -i cocomusic-api-latest.tar" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "docker run -d -p 8000:8000 --name cocomusic-api ${{ steps.tag.outputs.image_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "curl http://localhost:8000/api/docs" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Image Info:" >> $GITHUB_STEP_SUMMARY
        echo "- **Image Name**: ${{ steps.tag.outputs.image_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Branch/Tag**: ${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform**: linux/amd64" >> $GITHUB_STEP_SUMMARY
